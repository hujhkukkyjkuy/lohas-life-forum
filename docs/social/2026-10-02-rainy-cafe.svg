<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9bb8d4"/>
      <stop offset="0.45" stop-color="#c5d9eb"/>
      <stop offset="1" stop-color="#e8f0f6"/>
    </linearGradient>
    <linearGradient id="ceiling" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7fafc" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#e2eef6" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4eee6"/>
      <stop offset="1" stop-color="#e5d8c8"/>
    </linearGradient>
    <linearGradient id="marble" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf7f2"/>
      <stop offset="0.5" stop-color="#efe6da"/>
      <stop offset="1" stop-color="#e8dccf"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4e6f5" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#b8d0e4" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <radialGradient id="lamp" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#fff6e0"/>
      <stop offset="1" stop-color="#fff6e0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- soft rainy sky through glass roof -->
  <rect width="1080" height="520" fill="url(#sky)"/>
  <g fill="#dfe8f0" opacity="0.9">
    <ellipse cx="220" cy="120" rx="170" ry="52"/>
    <ellipse cx="340" cy="135" rx="120" ry="42"/>
    <ellipse cx="140" cy="145" rx="90" ry="36"/>
  </g>
  <g fill="#c9d7e4" opacity="0.85">
    <ellipse cx="720" cy="100" rx="150" ry="48"/>
    <ellipse cx="830" cy="118" rx="110" ry="40"/>
    <ellipse cx="640" cy="125" rx="90" ry="34"/>
  </g>
  <!-- gentle rain -->
  <g stroke="#9db6cc" stroke-width="2.5" opacity="0.45" stroke-linecap="round">
    <line x1="160" y1="190" x2="145" y2="260"/>
    <line x1="230" y1="200" x2="212" y2="275"/>
    <line x1="300" y1="195" x2="284" y2="270"/>
    <line x1="400" y1="210" x2="382" y2="285"/>
    <line x1="520" y1="185" x2="505" y2="255"/>
    <line x1="650" y1="200" x2="633" y2="275"/>
    <line x1="760" y1="190" x2="745" y2="265"/>
    <line x1="860" y1="205" x2="843" y2="280"/>
    <line x1="940" y1="195" x2="926" y2="260"/>
  </g>
  <!-- distant greenery / sea hint -->
  <ellipse cx="540" cy="470" rx="720" ry="70" fill="#7faa96" opacity="0.35"/>
  <rect y="455" width="1080" height="50" fill="#6a9aaa" opacity="0.22"/>

  <!-- glass ceiling frame (mall atrium) -->
  <g stroke="#c5b8a4" stroke-width="10" fill="none" opacity="0.85">
    <path d="M60 80 L540 30 L1020 80 L1020 420 L60 420 Z"/>
    <line x1="540" y1="30" x2="540" y2="420"/>
    <line x1="300" y1="55" x2="300" y2="420"/>
    <line x1="780" y1="55" x2="780" y2="420"/>
    <line x1="60" y1="200" x2="1020" y2="200"/>
    <line x1="60" y1="310" x2="1020" y2="310"/>
  </g>
  <rect x="70" y="90" width="940" height="320" fill="url(#glass)"/>
  <rect x="70" y="90" width="940" height="120" fill="url(#ceiling)"/>

  <!-- indoor marble floor -->
  <rect y="500" width="1080" height="850" fill="url(#floor)"/>
  <path d="M0 520 Q270 560 540 520 T1080 520 L1080 1350 L0 1350 Z" fill="url(#marble)" opacity="0.95"/>
  <!-- subtle marble veins -->
  <g stroke="#d9cbb8" stroke-width="2" opacity="0.35" fill="none">
    <path d="M80 700 C200 680 280 760 400 740"/>
    <path d="M500 820 C620 800 700 880 860 850"/>
    <path d="M200 1000 C340 980 420 1060 580 1030"/>
    <path d="M650 1120 C780 1100 860 1180 980 1150"/>
  </g>

  <!-- soft hanging lamp glow -->
  <ellipse cx="540" cy="560" rx="220" ry="90" fill="url(#lamp)" opacity="0.7"/>
  <rect x="520" y="480" width="40" height="50" rx="6" fill="#e8d5b5"/>
  <ellipse cx="540" cy="545" rx="55" ry="18" fill="#fff8e8"/>
  <ellipse cx="540" cy="545" rx="70" ry="28" fill="#ffe8b0" opacity="0.35" filter="url(#soft)"/>

  <!-- cafe table (marble-top) -->
  <ellipse cx="540" cy="980" rx="300" ry="48" fill="#ebe0d2"/>
  <ellipse cx="540" cy="968" rx="300" ry="42" fill="#f7f1e8"/>
  <rect x="510" y="980" width="60" height="150" rx="10" fill="#c4a882"/>
  <ellipse cx="540" cy="1135" rx="90" ry="16" fill="#a88b66" opacity="0.45"/>

  <!-- coffee + pastry (no people, no real brand) -->
  <g transform="translate(390,820)">
    <ellipse cx="55" cy="130" rx="50" ry="14" fill="#ddd0c0" opacity="0.7"/>
    <path d="M20 40 Q20 10 55 10 Q90 10 90 40 L85 120 Q55 135 25 120 Z" fill="#f5f0e8"/>
    <path d="M28 45 Q55 55 82 45" fill="none" stroke="#e8dcc8" stroke-width="4"/>
    <ellipse cx="55" cy="40" rx="32" ry="10" fill="#6f4e37"/>
    <ellipse cx="55" cy="36" rx="28" ry="8" fill="#8b5e3c"/>
    <path d="M90 55 Q125 55 125 90 Q125 120 95 120" fill="none" stroke="#d4c4b0" stroke-width="7" stroke-linecap="round"/>
    <!-- steam -->
    <path d="M40 0 Q35 -18 42 -30" fill="none" stroke="#c9b8a4" stroke-width="3" opacity="0.5" stroke-linecap="round"/>
    <path d="M58 -4 Q55 -22 62 -34" fill="none" stroke="#c9b8a4" stroke-width="3" opacity="0.45" stroke-linecap="round"/>
    <path d="M74 0 Q80 -16 72 -28" fill="none" stroke="#c9b8a4" stroke-width="3" opacity="0.4" stroke-linecap="round"/>
  </g>
  <g transform="translate(580,850)">
    <ellipse cx="70" cy="100" rx="70" ry="16" fill="#ddd0c0" opacity="0.65"/>
    <ellipse cx="70" cy="90" rx="68" ry="40" fill="#f3e7d3"/>
    <ellipse cx="70" cy="78" rx="58" ry="32" fill="#e8c9a0"/>
    <ellipse cx="70" cy="70" rx="48" ry="24" fill="#d4a574"/>
    <circle cx="55" cy="68" r="5" fill="#8b5e3c" opacity="0.5"/>
    <circle cx="80" cy="72" r="4" fill="#8b5e3c" opacity="0.45"/>
    <circle cx="68" cy="58" r="3.5" fill="#6f4e37" opacity="0.4"/>
  </g>

  <!-- tall greenery planters -->
  <g transform="translate(120,780)">
    <rect x="40" y="200" width="70" height="90" rx="10" fill="#c9b29a"/>
    <rect x="48" y="208" width="54" height="20" rx="4" fill="#b89a7e"/>
    <ellipse cx="75" cy="160" rx="70" ry="80" fill="#2d6a4f"/>
    <ellipse cx="40" cy="190" rx="45" ry="55" fill="#40916c"/>
    <ellipse cx="110" cy="185" rx="42" ry="50" fill="#52b788"/>
    <ellipse cx="75" cy="120" rx="35" ry="40" fill="#74c69d"/>
  </g>
  <g transform="translate(820,800)">
    <rect x="35" y="180" width="60" height="80" rx="8" fill="#bca48c"/>
    <ellipse cx="65" cy="145" rx="60" ry="70" fill="#1b4332"/>
    <ellipse cx="35" cy="170" rx="38" ry="45" fill="#2d6a4f"/>
    <ellipse cx="95" cy="165" rx="36" ry="42" fill="#40916c"/>
  </g>

  <!-- folded umbrella by planter (rain tip, not a shop prop) -->
  <g transform="translate(250,880)">
    <line x1="20" y1="40" x2="20" y2="200" stroke="#6c584c" stroke-width="7" stroke-linecap="round"/>
    <path d="M20 40 L55 55 L20 70 L-15 55 Z" fill="#5b8def" opacity="0.92"/>
    <circle cx="20" cy="36" r="7" fill="#4a7ad4"/>
  </g>

  <!-- soft side wall / glass storefront panes (anonymous) -->
  <g opacity="0.35">
    <rect x="40" y="560" width="90" height="280" rx="8" fill="#dce8f2" stroke="#c5b8a4" stroke-width="6"/>
    <rect x="950" y="560" width="90" height="280" rx="8" fill="#dce8f2" stroke="#c5b8a4" stroke-width="6"/>
  </g>

  <!-- caption card -->
  <rect x="120" y="1180" width="840" height="120" rx="20" fill="#2a3544" opacity="0.9"/>
  <text x="540" y="1230" text-anchor="middle" font-family="system-ui, 'PingFang HK', 'Noto Sans TC', 'Noto Sans CJK TC', sans-serif" font-size="40" font-weight="700" fill="#ffffff">驟雨天｜室內嘆杯咖啡先</text>
  <text x="540" y="1275" text-anchor="middle" font-family="system-ui, 'PingFang HK', 'Noto Sans TC', 'Noto Sans CJK TC', sans-serif" font-size="26" font-weight="500" fill="#ffd27a">康城生活圈 ・ 插畫示意</text>

  <!-- 示意 badge -->
  <rect x="40" y="40" width="100" height="44" rx="10" fill="#e63946"/>
  <text x="90" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#fff">示意</text>
</svg>
