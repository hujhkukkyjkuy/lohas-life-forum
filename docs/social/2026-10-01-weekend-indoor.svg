<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a5f"/>
      <stop offset="0.4" stop-color="#4a7ab0"/>
      <stop offset="0.7" stop-color="#87b8e0"/>
      <stop offset="1" stop-color="#c8dff0"/>
    </linearGradient>
    <linearGradient id="sunGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5ebe0"/>
      <stop offset="1" stop-color="#e8d5c4"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7eb8e8"/>
      <stop offset="1" stop-color="#b8d4e8"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- outdoor sky strip (top through window feel) -->
  <rect width="1080" height="520" fill="url(#sky)"/>
  <!-- sun -->
  <circle cx="820" cy="160" r="90" fill="#ffd27a" opacity="0.9"/>
  <circle cx="820" cy="160" r="140" fill="url(#sunGlow)" opacity="0.5"/>
  <!-- rain clouds -->
  <g fill="#dfe8f0" opacity="0.92">
    <ellipse cx="280" cy="140" rx="160" ry="55"/>
    <ellipse cx="380" cy="155" rx="120" ry="45"/>
    <ellipse cx="200" cy="160" rx="100" ry="40"/>
  </g>
  <g fill="#c5d4e0" opacity="0.85">
    <ellipse cx="520" cy="200" rx="140" ry="48"/>
    <ellipse cx="600" cy="215" rx="100" ry="38"/>
  </g>
  <!-- rain streaks -->
  <g stroke="#a8c4dc" stroke-width="3" opacity="0.55" stroke-linecap="round">
    <line x1="220" y1="220" x2="200" y2="300"/>
    <line x1="280" y1="230" x2="255" y2="320"/>
    <line x1="340" y1="225" x2="318" y2="310"/>
    <line x1="400" y1="240" x2="375" y2="330"/>
    <line x1="480" y1="250" x2="458" y2="335"/>
    <line x1="550" y1="255" x2="530" y2="340"/>
  </g>
  <!-- distant hills / sea hint -->
  <ellipse cx="540" cy="480" rx="700" ry="80" fill="#5a8f7a" opacity="0.45"/>
  <rect y="460" width="1080" height="60" fill="#3d6b7a" opacity="0.35"/>

  <!-- indoor cafe / mall floor -->
  <rect y="500" width="1080" height="850" fill="url(#floor)"/>
  <!-- large window frame -->
  <rect x="80" y="80" width="920" height="440" rx="16" fill="none" stroke="#8b6914" stroke-width="18"/>
  <line x1="540" y1="80" x2="540" y2="520" stroke="#8b6914" stroke-width="12"/>
  <line x1="80" y1="300" x2="1000" y2="300" stroke="#8b6914" stroke-width="10"/>

  <!-- table -->
  <ellipse cx="540" cy="980" rx="280" ry="40" fill="#c4a574"/>
  <rect x="500" y="980" width="80" height="160" rx="8" fill="#a8845a"/>
  <ellipse cx="540" cy="1145" rx="100" ry="18" fill="#8b6b45" opacity="0.5"/>

  <!-- iced drinks (no people) -->
  <g transform="translate(400,820)">
    <rect x="0" y="40" width="70" height="110" rx="12" fill="#7dd3c0"/>
    <rect x="8" y="50" width="54" height="40" rx="6" fill="#e0f7f3" opacity="0.7"/>
    <ellipse cx="35" cy="40" rx="36" ry="12" fill="#5bbbb0"/>
    <rect x="28" y="0" width="14" height="45" rx="4" fill="#f5f5f5"/>
    <circle cx="55" cy="70" r="6" fill="#fff" opacity="0.6"/>
    <circle cx="25" cy="95" r="5" fill="#fff" opacity="0.5"/>
  </g>
  <g transform="translate(610,800)">
    <rect x="0" y="50" width="75" height="120" rx="14" fill="#f4a261"/>
    <rect x="10" y="62" width="55" height="45" rx="6" fill="#ffe8d0" opacity="0.75"/>
    <ellipse cx="37" cy="50" rx="38" ry="13" fill="#e76f51"/>
    <rect x="30" y="5" width="14" height="50" rx="4" fill="#fff8f0"/>
    <path d="M75 80 Q100 100 75 130" fill="none" stroke="#e76f51" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- plant -->
  <g transform="translate(200,900)">
    <rect x="30" y="80" width="50" height="60" rx="6" fill="#c4785a"/>
    <ellipse cx="55" cy="70" rx="45" ry="50" fill="#2d6a4f"/>
    <ellipse cx="30" cy="90" rx="30" ry="35" fill="#40916c"/>
    <ellipse cx="80" cy="85" rx="28" ry="32" fill="#52b788"/>
  </g>
  <g transform="translate(820,920)">
    <rect x="25" y="70" width="45" height="55" rx="5" fill="#b08968"/>
    <ellipse cx="48" cy="55" rx="40" ry="45" fill="#1b4332"/>
    <ellipse cx="25" cy="70" rx="25" ry="30" fill="#2d6a4f"/>
  </g>

  <!-- umbrella leaning (weekend rain tip) -->
  <g transform="translate(140,700)">
    <path d="M40 120 Q120 20 200 120" fill="#e63946" opacity="0.9"/>
    <line x1="120" y1="110" x2="120" y2="280" stroke="#6c584c" stroke-width="8" stroke-linecap="round"/>
    <circle cx="120" cy="25" r="10" fill="#e63946"/>
  </g>

  <!-- text card -->
  <rect x="120" y="1180" width="840" height="120" rx="20" fill="#1b2838" opacity="0.88"/>
  <text x="540" y="1230" text-anchor="middle" font-family="system-ui, 'PingFang HK', 'Noto Sans TC', sans-serif" font-size="42" font-weight="700" fill="#ffffff">酷熱＋驟雨週末｜室內嘆餐先</text>
  <text x="540" y="1275" text-anchor="middle" font-family="system-ui, 'PingFang HK', 'Noto Sans TC', sans-serif" font-size="26" font-weight="500" fill="#ffd27a">康城生活圈 ・ 插畫示意</text>

  <!-- corner badge -->
  <rect x="40" y="40" width="100" height="44" rx="10" fill="#e63946"/>
  <text x="90" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#fff">示意</text>
</svg>
