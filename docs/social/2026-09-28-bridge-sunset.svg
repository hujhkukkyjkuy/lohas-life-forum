<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b1d6e"/>
      <stop offset="0.35" stop-color="#9d3c8a"/>
      <stop offset="0.62" stop-color="#f06a4f"/>
      <stop offset="0.8" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ffd98a"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f59a5b"/>
      <stop offset="0.25" stop-color="#b8527a"/>
      <stop offset="1" stop-color="#2a1850"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6d5"/>
      <stop offset="0.6" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b0f33" stop-opacity="0"/>
      <stop offset="1" stop-color="#1b0f33" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="820" fill="url(#sky)"/>
  <!-- clouds -->
  <g fill="#ffd0a8" opacity="0.35">
    <ellipse cx="220" cy="260" rx="170" ry="18"/>
    <ellipse cx="330" cy="290" rx="120" ry="12"/>
    <ellipse cx="820" cy="200" rx="200" ry="16"/>
    <ellipse cx="760" cy="235" rx="110" ry="10"/>
  </g>
  <!-- sun -->
  <circle cx="610" cy="700" r="210" fill="url(#sun)"/>
  <circle cx="610" cy="700" r="78" fill="#fff1c7"/>
  <!-- far hills -->
  <path d="M0 720 L90 650 L180 690 L300 600 L420 680 L520 640 L640 700 L760 620 L880 670 L980 610 L1080 660 L1080 820 L0 820Z" fill="#7a3a78" opacity="0.75"/>
  <!-- skyline (generic towers) -->
  <g fill="#4a2463">
    <rect x="30" y="700" width="40" height="120"/><rect x="80" y="670" width="36" height="150"/>
    <rect x="125" y="690" width="44" height="130"/><rect x="178" y="660" width="34" height="160"/>
    <rect x="850" y="680" width="38" height="140"/><rect x="895" y="650" width="42" height="170"/>
    <rect x="945" y="675" width="36" height="145"/><rect x="990" y="640" width="44" height="180"/>
    <rect x="1040" y="690" width="40" height="130"/>
  </g>
  <!-- sea -->
  <rect y="820" width="1080" height="530" fill="url(#sea)"/>
  <!-- sun reflection -->
  <g fill="#ffe7a8" opacity="0.8">
    <rect x="560" y="835" width="100" height="6" rx="3"/>
    <rect x="575" y="860" width="70" height="5" rx="2.5"/>
    <rect x="545" y="888" width="130" height="5" rx="2.5"/>
    <rect x="585" y="918" width="50" height="4" rx="2"/>
    <rect x="560" y="950" width="100" height="4" rx="2"/>
    <rect x="595" y="985" width="30" height="3" rx="1.5"/>
  </g>
  <!-- bridge: twin leaning arches (butterfly style, illustrative) -->
  <g stroke="#2a1440" fill="none" stroke-linecap="round">
    <path d="M300 800 Q540 470 780 800" stroke-width="16"/>
    <path d="M330 800 Q540 540 750 800" stroke-width="10" opacity="0.8"/>
    <g stroke-width="3" opacity="0.9">
      <line x1="380" y1="700" x2="380" y2="800"/><line x1="420" y1="660" x2="420" y2="800"/>
      <line x1="460" y1="632" x2="460" y2="800"/><line x1="500" y1="616" x2="500" y2="800"/>
      <line x1="540" y1="611" x2="540" y2="800"/><line x1="580" y1="616" x2="580" y2="800"/>
      <line x1="620" y1="632" x2="620" y2="800"/><line x1="660" y1="660" x2="660" y2="800"/>
      <line x1="700" y1="700" x2="700" y2="800"/>
    </g>
  </g>
  <!-- deck -->
  <rect x="-10" y="796" width="1100" height="16" fill="#2a1440"/>
  <g fill="#2a1440">
    <rect x="120" y="812" width="16" height="60"/><rect x="300" y="812" width="16" height="60"/>
    <rect x="764" y="812" width="16" height="60"/><rect x="944" y="812" width="16" height="60"/>
  </g>
  <!-- deck lights -->
  <g fill="#ffe7a8">
    <circle cx="60" cy="792" r="4"/><circle cx="200" cy="792" r="4"/><circle cx="340" cy="792" r="4"/>
    <circle cx="480" cy="792" r="4"/><circle cx="620" cy="792" r="4"/><circle cx="760" cy="792" r="4"/>
    <circle cx="900" cy="792" r="4"/><circle cx="1040" cy="792" r="4"/>
  </g>
  <!-- bridge reflection -->
  <path d="M300 830 Q540 1080 780 830" stroke="#2a1440" stroke-width="10" fill="none" opacity="0.25"/>
  <!-- birds -->
  <g stroke="#2a1440" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M760 420 q12 -12 24 0 q12 -12 24 0"/>
    <path d="M830 380 q9 -9 18 0 q9 -9 18 0"/>
    <path d="M700 470 q8 -8 16 0 q8 -8 16 0"/>
  </g>
  <!-- text band -->
  <rect y="1030" width="1080" height="320" fill="url(#fade)"/>
  <g font-family="Noto Sans CJK HK, Noto Sans CJK TC, sans-serif" fill="#ffffff">
    <text x="540" y="140" text-anchor="middle" font-size="46" font-weight="700" fill="#fff7e8" opacity="0.95">康城站行 10 分鐘</text>
    <text x="540" y="1150" text-anchor="middle" font-size="84" font-weight="900">跨灣大橋睇日落</text>
    <text x="540" y="1225" text-anchor="middle" font-size="36" font-weight="500" fill="#ffe2b8">路線 ・ 小貼士 ・ 記得帶風褸</text>
    <text x="540" y="1305" text-anchor="middle" font-size="28" font-weight="500" fill="#ffffff" opacity="0.75">康城生活圈 ・ 插畫示意</text>
  </g>
</svg>
